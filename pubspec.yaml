name: thunder_api
description: >-
  CLI that builds a Postman collection, web API docs and Express routes from
  simple // @desc, // @route comments in your Node.js controllers.
version: 1.1.0
repository: https://github.com/AbdAlftahSalem/Build-API-Collection
issue_tracker: https://github.com/AbdAlftahSalem/Build-API-Collection/issues
topics:
  - cli
  - postman
  - api
  - express
  - documentation

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.4.0
  path: ^1.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0

executables:
  thunder_api: thunder_api
